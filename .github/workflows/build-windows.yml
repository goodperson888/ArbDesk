name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        shell: pwsh
        run: |
          npm run package:win 2>&1 | Tee-Object -FilePath package-win.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = (Get-Content package-win.log -Tail 80) -join '%0A'
            Write-Output "::error title=Windows packaging failed::$tail"
            exit $buildExit
          }

      - name: Upload packaging log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ArbDesk-Windows-build-log
          path: package-win.log
          retention-days: 7

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ArbDesk-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
