name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build NSIS installer
        shell: pwsh
        run: |
          npm run package:win 2>&1 | Tee-Object -FilePath package-win.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = (Get-Content package-win.log -Tail 80) -join '%0A'
            Write-Output "::error title=Windows packaging failed::$tail"
            exit $buildExit
          }

      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArbDesk-Windows-build-log
          path: package-win.log
          retention-days: 7

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ArbDesk-Windows
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
          retention-days: 30
