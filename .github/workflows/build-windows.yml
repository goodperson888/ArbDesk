name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      market_profile:
        description: 选择安装包包含的平台
        required: true
        default: btc-gate-kalshi
        type: choice
        options:
          - btc-gate-kalshi
          - btc-all

permissions:
  contents: write

env:
  MARKET_PROFILE: ${{ inputs.market_profile }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        id: electron-cache
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          npm ci --no-audit --no-fund
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALL_SECONDS=$([math]::Round($timer.Elapsed.TotalSeconds, 2))"
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALL_RESULT=$(if ($exitCode -eq 0) { 'success' } else { 'failure' })"
          exit $exitCode

      - name: Run tests
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          npm test
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_SECONDS=$([math]::Round($timer.Elapsed.TotalSeconds, 2))"
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_RESULT=$(if ($exitCode -eq 0) { 'success' } else { 'failure' })"
          exit $exitCode

      - name: Build application
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          npm run build
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_SECONDS=$([math]::Round($timer.Elapsed.TotalSeconds, 2))"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_RESULT=$(if ($exitCode -eq 0) { 'success' } else { 'failure' })"
          exit $exitCode

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          node scripts/package-profile.mjs --profile=$env:MARKET_PROFILE --target=win --skip-checks 2>&1 | Tee-Object -FilePath package-win.log
          $buildExit = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_SECONDS=$([math]::Round($timer.Elapsed.TotalSeconds, 2))"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_RESULT=$(if ($buildExit -eq 0) { 'success' } else { 'failure' })"
          if ($buildExit -ne 0) {
            $tail = (Get-Content package-win.log -Tail 80) -join '%0A'
            Write-Output "::error title=Windows packaging failed::$tail"
            exit $buildExit
          }

      - name: Write build summary
        if: always()
        shell: pwsh
        run: |
          function Show-Duration([string]$seconds) {
            if ([string]::IsNullOrWhiteSpace($seconds)) { return '—' }
            return ('{0:N2} 秒' -f [double]$seconds)
          }
          function Show-Result([string]$result) {
            if ([string]::IsNullOrWhiteSpace($result)) { return 'skipped' }
            return $result
          }

          $installSeconds = $env:INSTALL_SECONDS
          $testSeconds = $env:TEST_SECONDS
          $buildSeconds = $env:BUILD_SECONDS
          $packageSeconds = $env:PACKAGE_SECONDS
          $totalSeconds = 0.0
          @($installSeconds, $testSeconds, $buildSeconds, $packageSeconds) | ForEach-Object {
            if (-not [string]::IsNullOrWhiteSpace($_)) { $totalSeconds += [double]$_ }
          }

          $profileOutput = Join-Path 'release' $env:MARKET_PROFILE
          $exeFiles = @(Get-ChildItem -Path $profileOutput -Filter *.exe -File -ErrorAction SilentlyContinue)
          $exeSummary = if ($exeFiles.Count -eq 0) {
            '未生成'
          } else {
            ($exeFiles | ForEach-Object {
              '{0} — {1:N2} MB ({2:N0} bytes)' -f $_.Name, ($_.Length / 1MB), $_.Length
            }) -join '<br>'
          }
          $cacheHit = '${{ steps.electron-cache.outputs.cache-hit }}'
          if ([string]::IsNullOrWhiteSpace($cacheHit)) { $cacheHit = 'false' }

          @"
          ## Windows 构建摘要

          | 阶段 | 结果 | 真实耗时 |
          | --- | --- | ---: |
          | 安装依赖 | $(Show-Result $env:INSTALL_RESULT) | $(Show-Duration $installSeconds) |
          | 自动测试 | $(Show-Result $env:TEST_RESULT) | $(Show-Duration $testSeconds) |
          | 应用构建 | $(Show-Result $env:BUILD_RESULT) | $(Show-Duration $buildSeconds) |
          | NSIS 打包 | $(Show-Result $env:PACKAGE_RESULT) | $(Show-Duration $packageSeconds) |
          | **上述阶段合计** | — | **$(Show-Duration ([string]$totalSeconds))** |

          **最终 EXE：** $exeSummary

          **运行环境：** $env:RUNNER_OS / $env:ImageOS $env:ImageVersion / $env:RUNNER_NAME<br>
          **Electron 下载缓存命中：** $cacheHit<br>
          **提交：** ``$env:GITHUB_SHA``
          **市场 Profile：** ``$env:MARKET_PROFILE``

          > 阶段合计不包含 Checkout、Node.js 初始化、缓存恢复和产物上传耗时；这些仍可从 Actions 步骤时间直接查看。
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload packaging log
        if: failure() && env.PACKAGE_RESULT == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ArbDesk-Windows-build-log
          path: package-win.log
          retention-days: 7

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ArbDesk-${{ inputs.market_profile }}-Windows-Installer
          path: release/${{ inputs.market_profile }}/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $profileOutput = Join-Path 'release' $env:MARKET_PROFILE
          $exe = (Get-ChildItem -Path $profileOutput -Filter *.exe -File | Select-Object -First 1).FullName
          if (-not $exe) { throw "未找到安装包" }
          $notes = @"
          ArbDesk $tag — $env:MARKET_PROFILE

          下载下方带有 ``$env:MARKET_PROFILE`` 标识的 ArbDesk 安装包即可。
          "@
          gh release create $tag $exe --title "ArbDesk $tag" --notes $notes --verify-tag=false 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag $exe --clobber
            gh release edit $tag --notes $notes
          }
